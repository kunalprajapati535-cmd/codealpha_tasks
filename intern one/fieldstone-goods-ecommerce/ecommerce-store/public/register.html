<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Fieldstone Goods</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="brand"><span class="mark"></span>Fieldstone Goods</a>
    <nav class="main-nav">
      <a href="/">Shop</a>
      <a href="/orders.html">Orders</a>
      <span data-account-slot></span>
      <a href="/cart.html" class="nav-cart">Cart <span class="cart-count" data-cart-count>0</span></a>
    </nav>
  </div>
</header>

<main class="auth-wrap">
  <h1>Create an account</h1>
  <p class="auth-sub">Takes about fifteen seconds.</p>

  <div class="form-error" data-form-error></div>

  <form data-register-form>
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" required autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="new-password" minlength="6">
    </div>
    <button type="submit" class="btn block" data-submit-btn>Create account</button>
  </form>

  <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
</main>

<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
